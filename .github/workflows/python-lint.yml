name: Linting

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,test,lint]
      - name: Analyzing the code with ruff
        run: |
          ruff check $(git ls-files '*.py')
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package with all extras and doc requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[all]' -r docs/requirements.txt
      - name: Build documentation with warnings as errors
        run: |
          python -m sphinx -b html -W docs docs/_build/html
